components:
  schemas:
    AddVariantToGroupRequest:
      properties:
        product_group_id:
          type: integer
          title: Product Group Id
        gtin:
          anyOf:
            - type: string
              maxLength: 14
            - type: "null"
          title: Gtin
        mpn:
          anyOf:
            - type: string
              maxLength: 100
            - type: "null"
          title: Mpn
        static_attributes:
          anyOf:
            - additionalProperties: true
              type: object
            - type: "null"
          title: Static Attributes
        weight_grams:
          type: integer
          minimum: 0
          title: Weight Grams
          default: 0
      type: object
      required:
        - product_group_id
      title: AddVariantToGroupRequest
      description: |-
        Request schema for adding a variant to an existing product group.

        Endpoint: POST /api/v1/seller/variants/add-to-group

        This creates a new CatalogVariant and associates it with an existing ProductGroup.
        Used when adding a color/size/storage variant to an existing product.
    ApproveListingResponse:
      properties:
        listing_id:
          type: string
          title: Listing Id
      type: object
      required:
        - listing_id
      title: ApproveListingResponse
      description: Response schema for listing approval.
    ApproveVariantResponse:
      properties:
        variant_id:
          type: string
          title: Variant Id
      type: object
      required:
        - variant_id
      title: ApproveVariantResponse
      description: Response schema for variant approval.
    AttributeItemSchema:
      properties:
        name_en:
          type: string
          maxLength: 255
          minLength: 1
          title: Name En
        name_fa:
          type: string
          maxLength: 255
          minLength: 1
          title: Name Fa
        type:
          type: string
          maxLength: 50
          minLength: 1
          title: Type
        value:
          type: string
          maxLength: 255
          minLength: 1
          title: Value
      type: object
      required:
        - name_en
        - name_fa
        - type
        - value
      title: AttributeItemSchema
      description: Schema for a category attribute item (required_attributes / variation_themes).
    BatchEnrichByIdItemResponse:
      properties:
        listing_id:
          type: string
          title: Listing Id
        found:
          type: boolean
          title: Found
        variant_id:
          anyOf:
            - type: string
            - type: "null"
          title: Variant Id
        variant_name:
          anyOf:
            - type: string
            - type: "null"
          title: Variant Name
        variant_sku:
          anyOf:
            - type: string
            - type: "null"
          title: Variant Sku
        product_title:
          anyOf:
            - type: string
            - type: "null"
          title: Product Title
        brand_name:
          anyOf:
            - type: string
            - type: "null"
          title: Brand Name
        cover_image:
          anyOf:
            - type: string
            - type: "null"
          title: Cover Image
        category_name_fa:
          anyOf:
            - type: string
            - type: "null"
          title: Category Name Fa
      type: object
      required:
        - listing_id
        - found
      title: BatchEnrichByIdItemResponse
      description: Single item in a batch enrichment by ID response.
    BatchEnrichByIdsRequest:
      properties:
        listing_ids:
          items:
            type: string
          type: array
          maxItems: 50
          minItems: 1
          title: Listing Ids
      type: object
      required:
        - listing_ids
      title: BatchEnrichByIdsRequest
      description: Request body for batch listing enrichment by listing IDs.
    BatchEnrichByIdsResponse:
      properties:
        items:
          items:
            $ref: "#/components/schemas/BatchEnrichByIdItemResponse"
          type: array
          title: Items
      type: object
      required:
        - items
      title: BatchEnrichByIdsResponse
      description: Response body for batch listing enrichment by listing IDs.
    BatchResolveVariantItem:
      properties:
        variant_id:
          type: string
          title: Variant Id
        found:
          type: boolean
          title: Found
        gtin:
          anyOf:
            - type: string
            - type: "null"
          title: Gtin
        mpn:
          anyOf:
            - type: string
            - type: "null"
          title: Mpn
        brand_name:
          anyOf:
            - type: string
            - type: "null"
          title: Brand Name
        static_attributes:
          anyOf:
            - additionalProperties: true
