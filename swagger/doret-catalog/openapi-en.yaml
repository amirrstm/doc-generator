openapi: 3.1.0
info:
  title: Catalog
  version: 1.0.0
paths:
  /api/v1/common/health:
    get:
      tags:
        - common
      summary: Health Check
      description: Health check endpoint.
      operationId: health_check_api_v1_common_health_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
      parameters:
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
  /api/v1/customer/categories/root:
    get:
      tags:
        - customer
        - customer-categories
      summary: Get root categories
      description: |-
        Get all root categories (categories with no parent).

        Returns all categories where parent_id IS NULL.
        Useful for displaying top-level navigation.
        icon field contains resolved signed URL or null.
      operationId: get_root_categories_api_v1_customer_categories_root_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/CategoryResponse"
                type: array
                title: Response Get Root Categories Api V1 Customer Categories Root Get
      parameters:
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
  /api/v1/customer/categories/{category_id}/children:
    get:
      tags:
        - customer
        - customer-categories
      summary: Get category children
      description: |-
        Get all immediate children of a category.

        Returns all categories where parent_id matches the given category_id.
        Returns 404 if the parent category doesn't exist.
        icon field contains resolved signed URL or null.
      operationId: get_category_children_api_v1_customer_categories__category_id__children_get
      parameters:
        - name: category_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Category Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponse"
                title: >-
                  Response Get Category Children Api V1 Customer Categories  Category Id  Children
                  Get
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
          description: Not Found
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/categories/tree:
    get:
      tags:
        - customer
        - customer-categories
      summary: Get category tree
      description: Get the complete category hierarchy as a nested tree for customers.
      operationId: get_category_tree_api_v1_customer_categories_tree_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/CustomerCategoryTreeNodeResponse"
                type: array
                title: Response Get Category Tree Api V1 Customer Categories Tree Get
      parameters:
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
  /api/v1/customer/categories/{category_id}/rules:
    get:
      tags:
        - customer
        - customer-categories
      summary: Get category rules
      description: |-
        Get category rules (required_attributes, variation_themes, is_gtin_required).

        Returns the validation rules for products in this category.
        Returns 404 if the category doesn't exist.
      operationId: get_category_rules_api_v1_customer_categories__category_id__rules_get
      parameters:
        - name: category_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Category Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryRulesResponse"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
          description: Not Found
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/variants/:
    get:
      tags:
        - customer
        - customer-variants
      summary: List variants (paginated, optional category filter)
      description: |-
        List catalog variants with page-based pagination and optional category filtering.

        **Category Filtering** (optional, choose at most one):
        - `category_id`: UUID of the category
        - `category_slug`: URL slug of the category

        If no category filter is provided, all active variants are returned.

        **Pagination**:
        - `page`: Page number (starts at 1, default: 1)
        - `page_size`: Items per page (1-100, default: 20)

        **Examples**:
        - `?page=1&page_size=20` (all variants)
        - `?category_slug=electronics&page=2&page_size=20` (filtered by category)

        Response includes pagination metadata: `page`, `page_size`, `total_items`.
      operationId: list_variants_api_v1_customer_variants__get
      parameters:
        - name: category_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: "null"
            title: Category Id
        - name: category_slug
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Category Slug
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            description: Page number (starts at 1)
            default: 1
            title: Page
          description: Page number (starts at 1)
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            description: Items per page
            default: 20
            title: Page Size
          description: Items per page
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VariantWithGroupResponse"
                title: Response List Variants Api V1 Customer Variants  Get
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
          description: Bad Request
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/variants/group/{group_id}:
    get:
      tags:
        - customer
        - customer-variants
      summary: Get variants by product group
      description: |-
        Get all variants for a product group (product family).

        Note: This endpoint returns variants without nested product group data,
        so no image URL resolution is needed.
      operationId: get_variants_by_group_api_v1_customer_variants_group__group_id__get
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
            title: Group Id
        - name: active_only
          in: query
          required: false
          schema:
            type: boolean
            default: true
            title: Active Only
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VariantResponse"
                title: Response Get Variants By Group Api V1 Customer Variants Group  Group Id  Get
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
          description: Not Found
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/variants/{variant_id}:
    get:
      tags:
        - customer
        - customer-variants
      summary: Get variant by ID
      description: |-
        Get a catalog variant by ID with product group details.

        Product group catalog_images contain signed URLs (resolved from media IDs).
      operationId: get_variant_by_id_api_v1_customer_variants__variant_id__get
      parameters:
        - name: variant_id
          in: path
          required: true
          schema:
            type: string
            title: Variant Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantWithGroupResponse"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
          description: Not Found
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/listings:
    get:
      tags:
        - customer
        - customer-listings
      summary: Browse listings
      description: Browse customer-visible listings with filters, pagination, and enriched product data.
      operationId: list_listings_api_v1_customer_listings_get
      parameters:
        - name: category_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: "null"
            description: Filter by category ID
            title: Category Id
          description: Filter by category ID
        - name: seller_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: "null"
            description: Filter by seller ID
            title: Seller Id
          description: Filter by seller ID
        - name: condition
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                minLength: 1
                maxLength: 50
              - type: "null"
            description: Filter by condition
            title: Condition
          description: Filter by condition
        - name: brand_name
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                minLength: 1
                maxLength: 200
              - type: "null"
            description: Filter by brand name
            title: Brand Name
          description: Filter by brand name
        - name: price_min
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: Minimum price (inclusive)
            title: Price Min
          description: Minimum price (inclusive)
        - name: price_max
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: Maximum price (inclusive)
            title: Price Max
          description: Maximum price (inclusive)
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            description: "Sort order: newest, price_asc, price_desc"
            default: newest
            title: Sort By
          description: "Sort order: newest, price_asc, price_desc"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            description: Page number
            default: 1
            title: Page
          description: Page number
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            description: Number of items per page (max 100)
            default: 20
            title: Page Size
          description: Number of items per page (max 100)
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerListingResponse"
                title: Response List Listings Api V1 Customer Listings Get
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/listings/variant/{variant_id}:
    get:
      tags:
        - customer
        - customer-listings
      summary: Get listings by variant
      description: |-
        Get all seller listings for a catalog variant with enriched data.

        Returns listings with nested variant, product group, and category (with tree).
        All media IDs (listing, product group) are resolved to signed URLs.
      operationId: get_listings_by_variant_api_v1_customer_listings_variant__variant_id__get
      parameters:
        - name: variant_id
          in: path
          required: true
          schema:
            type: string
            title: Variant Id
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            description: Page number
            default: 1
            title: Page
          description: Page number
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            description: Number of items per page (max 100)
            default: 50
            title: Page Size
          description: Number of items per page (max 100)
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ListingResponse"
                title: Response Get Listings By Variant Api V1 Customer Listings Variant  Variant Id  Get
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
          description: Not Found
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/listings/batch:
    post:
      tags:
        - customer
        - customer-listings
      summary: Batch enrich listings
      description: Batch lookup of listings with enriched product display data for (seller_id, sku) pairs.
      operationId: batch_enrich_listings_api_v1_customer_listings_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/core__api__v1__internal__listings__schemas__BatchEnrichRequest"
        required: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/core__api__v1__customer__listings__schemas__BatchEnrichResponse
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      parameters:
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
  /api/v1/customer/listings/{listing_id}:
    get:
      tags:
        - customer
        - customer-listings
      summary: Get listing detail
      description: Get a single listing with enriched variant, product group, and category data.
      operationId: get_listing_detail_api_v1_customer_listings__listing_id__get
      parameters:
        - name: listing_id
          in: path
          required: true
          schema:
            type: string
            title: Listing Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListingResponse"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
          description: Not Found
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/product-groups/search:
    get:
      tags:
        - customer
        - customer-product-groups
      summary: Search product groups
      description: |-
        Search product groups using full-text search.

        Searches across brand name, master title, and master description.
        Results are ordered by relevance (highest first).
        catalog_images contain signed URLs (resolved from media IDs).
      operationId: search_product_groups_api_v1_customer_product_groups_search_get
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
            description: Search query string
            title: Q
          description: Search query string
        - name: category_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: "null"
            description: Filter by category ID
            title: Category Id
          description: Filter by category ID
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            description: "Page number (1-indexed). Default: 1."
            default: 1
            title: Page
          description: "Page number (1-indexed). Default: 1."
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            description: "Number of items per page. Default: 20, Max: 100."
            default: 20
            title: Page Size
          description: "Number of items per page. Default: 20, Max: 100."
        - name: include_variants
          in: query
          required: false
          schema:
            type: boolean
            description: Include variants in response
            default: false
            title: Include Variants
          description: Include variants in response
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/product-groups/filters:
    get:
      tags:
        - customer
        - customer-product-groups
      summary: Get product group filters for a category
      description: |-
        Get dynamic filter values for a category.

        Returns distinct values from variants' static_attributes for each
        required attribute of the category. Includes counts per value.
      operationId: get_filters_api_v1_customer_product_groups_filters_get
      parameters:
        - name: category_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
            description: Category ID to get filters for
            title: Category Id
          description: Category ID to get filters for
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/product-groups/{group_id}:
    get:
      tags:
        - customer
        - customer-product-groups
      summary: Get product group by ID
      description: |-
        Get a single product group by ID with all active variants.

        Returns product group with variant data.
        catalog_images and cover_image contain signed URLs (resolved from media IDs).
      operationId: get_product_group_api_v1_customer_product_groups__group_id__get
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
            title: Group Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/product-groups:
    get:
      tags:
        - customer
        - customer-product-groups
      summary: List product groups
      description: |-
        List product groups with optional filters.

        Returns paginated list of product groups with their active variants.
        Results are ordered by creation date (newest first).
        catalog_images and cover_image contain signed URLs (resolved from media IDs).
      operationId: list_product_groups_api_v1_customer_product_groups_get
      parameters:
        - name: category_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: "null"
            description: Filter by category ID
            title: Category Id
          description: Filter by category ID
        - name: brand_name
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                minLength: 1
                maxLength: 200
              - type: "null"
            description: Filter by brand name
            title: Brand Name
          description: Filter by brand name
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            description: "Page number (1-indexed). Default: 1."
            default: 1
            title: Page
          description: "Page number (1-indexed). Default: 1."
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            description: "Number of items per page. Default: 20, Max: 100."
            default: 20
            title: Page Size
          description: "Number of items per page. Default: 20, Max: 100."
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/shops/{shop_id}/categories:
    get:
      tags:
        - customer
        - customer-shops
      summary: Get shop categories with listings
      description: >-
        Returns leaf categories that have active listings for the specified shop, with each listing
        including variant and product group data.
      operationId: get_shop_categories_api_v1_customer_shops__shop_id__categories_get
      parameters:
        - name: shop_id
          in: path
          required: true
          schema:
            type: string
            title: Shop Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopCategoryResponse"
                title: Response Get Shop Categories Api V1 Customer Shops  Shop Id  Categories Get
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/seller/categories/search:
    get:
      tags:
        - seller
        - seller-categories
      summary: Search categories
      description: >-
        Full-text search for categories by name (Farsi or English). Returns results with breadcrumb
        path.
      operationId: search_categories_api_v1_seller_categories_search_get
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            description: Search query
            title: Q
          description: Search query
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            description: Page number
            default: 1
            title: Page
          description: Page number
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            description: Number of items per page
            default: 20
            title: Page Size
          description: Number of items per page
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerCategorySearchResponse"
        "422":
          description: Validation Error
          content:
            application/json:
