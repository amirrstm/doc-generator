            - type: string
            - type: "null"
          title: Master Description
        catalog_images:
          anyOf:
            - items:
                type: string
              type: array
            - type: "null"
          title: Catalog Images
        cover_image:
          anyOf:
            - type: string
            - type: "null"
          title: Cover Image
        group_created_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Group Created At
        group_updated_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Group Updated At
        category_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
