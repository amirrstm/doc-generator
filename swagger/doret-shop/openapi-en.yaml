          description: Map of shop_id to shop summary for found shops
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResolveResponse"
        "400":
          description: Batch size exceeds maximum of 50
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "422":
