            - type: "null"
          title: Business Category
          description: Business category {id, name} or null
        shipping_configurations:
          anyOf:
            - items:
                $ref: "#/components/schemas/ShippingConfigSummary"
              type: array
            - type: "null"
          title: Shipping Configurations
          description: Shipping configs (null if not included, [] if included but empty)
        bnpl_plans:
          anyOf:
            - items: {}
              type: array
            - type: "null"
          title: Bnpl Plans
          description: BNPL plans (null if not included, [] if included but empty)
      type: object
      required:
