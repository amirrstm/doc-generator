          type: string
          title: Plan Id
          description: Plan identifier
        plan_name:
          anyOf:
            - type: string
            - type: "null"
          title: Plan Name
          description: Plan display name
        plan_name_fa:
          anyOf:
            - type: string
            - type: "null"
          title: Plan Name Fa
