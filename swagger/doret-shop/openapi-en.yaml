    RequestSettlementRequest:
      properties:
        amount_minor:
          type: integer
          exclusiveMinimum: 0
          title: Amount Minor
          description: >-
            Amount to withdraw in minor currency units (e.g., Rials for IRR). Must be positive and
            not exceed available wallet balance. Example: 1000000 = 1,000,000 Rials.
          examples:
            - 1000000
      type: object
      required:
        - amount_minor
      title: RequestSettlementRequest
      description: |-
        Request body for requesting a settlement (withdrawal).

        Note: shop_id comes from X-SHOP-ID header, hovitech_id from X-HOVITECH-ID header.
        The default settlement account (Green wallet) is used automatically.
    RequestShopCreationRequest:
      properties:
        default_currency_id:
          type: string
          maxLength: 3
          minLength: 3
          title: Default Currency Id
          description: >-
            ISO 4217 currency code for the shop's default currency. Example: 'IRR' for Iranian Rial,
            'USD' for US Dollar. This determines the currency used for pricing and settlements.
          examples:
            - IRR
      type: object
      required:
        - default_currency_id
      title: RequestShopCreationRequest
      description: |-
        Request body for creating a new shop.

        Note: org_id and doret_social_id are extracted from request headers
        (X-ORGANIZATION-ID and X-MAIN-SOCIAL-ID respectively).
    ResolveShopsBatchRequest:
      properties:
