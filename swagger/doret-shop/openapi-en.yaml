          description: Signed logo URL (null if not included or no logo)
        merchant_id:
          anyOf:
            - type: string
            - type: "null"
          title: Merchant Id
          description: GreenBank merchant identifier (UUID)
        contract_no:
          anyOf:
            - type: string
            - type: "null"
          title: Contract No
          description: GreenBank contract number
        default_currency_id:
          type: string
