      description: Response for batch shop resolution. Maps shop_id to shop summary.
    BatchShopSummary:
      properties:
        id:
          type: string
          title: Id
          description: Shop identifier (UUID)
        org_id:
          type: string
          title: Org Id
          description: Organization identifier (UUID)
        lifecycle_state:
          type: string
          title: Lifecycle State
          description: Current lifecycle state
        suspended:
          type: boolean
          title: Suspended
          description: Whether shop operations are suspended
        name:
