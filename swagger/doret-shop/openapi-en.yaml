        - org_id
        - lifecycle_state
        - suspended
        - doret_social_id
        - default_currency_id
        - default_currency_instrument
      title: BatchShopSummary
      description: Summary of a single shop in a batch resolve response.
    BnplPlanInfo:
      properties:
