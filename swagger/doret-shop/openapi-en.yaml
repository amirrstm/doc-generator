openapi: 3.1.0
info:
  title: Shop
  version: 1.0.0
paths:
  /api/v1/common/health:
    get:
      tags:
        - common
      summary: Health Check
      description: Health check endpoint
      operationId: health_check_api_v1_common_health_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/core__api__v1__common__schemas__HealthResponse"
      parameters:
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
  /api/v1/customer/shops:
    post:
      tags:
        - customer
      summary: Request shop creation
      description: >-
        Create a new shop in REQUESTED state. The shop must complete the onboarding flow: contract
        -> shop info -> shipping config -> payment -> activation. Organization ID and social profile
        are extracted from request headers. Returns the created shop with initial REQUESTED
        lifecycle state.
      operationId: request_shop_creation_api_v1_customer_shops_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestShopCreationRequest"
      responses:
        "201":
          description: Shop created successfully in REQUESTED state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResponse_ShopCreatedResponse_"
        "400":
          description: Invalid currency code or missing required headers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "409":
          description: Shop already exists for this social profile in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      parameters:
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
  /api/v1/customer/shop:
    get:
      tags:
        - customer
      summary: Get my shop for current page
      description: >-
        Get the shop for the current page context (identified by X-SOCIAL-MAIN-ID header). One page
        can have at most one shop (1:1 relationship). Returns shop in any lifecycle state, including
        incomplete shops (for resuming creation). Returns 404 only if no shop exists for the current
        page.
      operationId: get_my_shop_api_v1_customer_shop_get
      responses:
        "200":
          description: Shop details for current page (any state)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopDetailResponse"
        "400":
          description: Missing X-SOCIAL-MAIN-ID header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "404":
          description: No shop found for current page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      parameters:
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
  /api/v1/customer/shop/cancel:
    post:
      tags:
        - customer
      summary: Cancel incomplete shop creation
      description: >-
        Cancel an incomplete shop creation for the current page and allow starting fresh. Only works
        for shops in early lifecycle states: REQUESTED, CONTRACT_SIGNED, SHOP_INFO_ADDED,
        SHIPMENT_INFO_ADDED. Cannot cancel shops that are PAID, ACTIVE, or ADDENDUM_PENDING. After
        canceling, the merchant can create a new shop for the same page.
      operationId: cancel_shop_creation_api_v1_customer_shop_cancel_post
      responses:
        "200":
          description: Shop creation canceled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResponse_CancelShopCreationResponse_"
        "400":
          description: Missing X-SOCIAL-MAIN-ID header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "404":
          description: No shop found for current page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "409":
          description: Shop cannot be canceled (already PAID, ACTIVE, or ADDENDUM_PENDING)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      parameters:
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
  /api/v1/customer/shops/{shop_id}/contract:
    get:
      tags:
        - customer
      summary: Get store contract for shop
      description: >-
        Get the store contract/agreement for a shop in REQUESTED state. Returns contract clauses and
        external contracts for display before signing. Must be called before sign-contract to show
        the contract to the user.
      operationId: get_store_contract_api_v1_customer_shops__shop_id__contract_get
      parameters:
        - name: shop_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Shop Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Store contract details retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreContractResponse"
        "404":
          description: Shop not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "409":
          description: Shop not in REQUESTED state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "503":
          description: Contract service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
  /api/v1/customer/shops/{shop_id}/sign-contract:
    post:
      tags:
        - customer
      summary: Sign contract for shop
      description: >-
        Sign the contract for a shop in REQUESTED state. This calls the Contract Service to create
        and sign the contract. Successfully signing transitions the shop to CONTRACT_SIGNED state.
        Must be completed before adding shop information.
      operationId: sign_contract_api_v1_customer_shops__shop_id__sign_contract_post
      parameters:
        - name: shop_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Shop Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignContractRequest"
      responses:
        "200":
          description: Contract signed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResponse_SignContractResponse_"
        "404":
          description: Shop not found or not owned by user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "409":
          description: Shop not in REQUESTED state (contract already signed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "503":
          description: Contract service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
  /api/v1/customer/shops/{shop_id}/sign-addendum:
    post:
      tags:
        - customer
      summary: Sign contract addendum for shop
      description: >-
        Confirm signing of contract addendum for a shop in ADDENDUM_PENDING state. Called after shop
        owner has signed the addendum on Contract Service. Successfully signing transitions the shop
        back to ACTIVE state.
      operationId: sign_addendum_api_v1_customer_shops__shop_id__sign_addendum_post
      parameters:
        - name: shop_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Shop Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Addendum signed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResponse_SignAddendumResponse_"
        "404":
          description: Shop not found or not owned by user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "409":
          description: Shop not in ADDENDUM_PENDING state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/shops/{shop_id}/info:
    put:
      tags:
        - customer
      summary: Add or update shop information
      description: >-
        Add or update comprehensive shop information. For initial add: Shop must be in
        CONTRACT_SIGNED state, transitions to SHOP_INFO_ADDED. For updates: Shop can be in
        SHOP_INFO_ADDED, SHIPMENT_INFO_ADDED, PAID, or ACTIVE state. Includes shop name, business
        category, owner details, and address.
      operationId: add_shop_info_api_v1_customer_shops__shop_id__info_put
      parameters:
        - name: shop_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Shop Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddShopInfoRequest"
      responses:
        "200":
          description: Shop information added/updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResponse_AddShopInfoResponse_"
        "404":
          description: Shop or business category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "409":
          description: Shop not in allowed state or category inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/shops/{shop_id}/shipping-configurations:
    post:
      tags:
        - customer
      summary: Add shipping configuration
      description: >-
        Add a shipping configuration to a shop during onboarding. The first configuration triggers
        state transition to SHIPMENT_INFO_ADDED. Multiple configurations can exist; use PUT /default
        to change the default. First configuration is automatically set as default.
      operationId: add_shipping_configuration_api_v1_customer_shops__shop_id__shipping_configurations_post
      parameters:
        - name: shop_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Shop Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddShippingConfigurationRequest"
      responses:
        "201":
          description: Shipping configuration created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResponse_ShippingConfigurationResponse_"
        "404":
          description: Shop not found or not owned by user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "409":
          description: Shop not in valid state for adding shipping configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    get:
      tags:
        - customer
      summary: List shipping configurations
      description: >-
        List all shipping configurations for a shop during onboarding. Returns configurations with
        their type, pricing, and default status.
      operationId: list_shipping_configurations_api_v1_customer_shops__shop_id__shipping_configurations_get
      parameters:
        - name: shop_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Shop Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: List of shipping configurations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionResponse_ShippingConfigurationResponse_"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/shops/{shop_id}/shipping-configurations/default:
    put:
      tags:
        - customer
      summary: Set default shipping configuration
      description: >-
        Set a shipping configuration as the default during onboarding. The default configuration is
        used when customers don't select a specific option. Only one configuration can be default at
        a time.
      operationId: >-
        set_default_shipping_config_api_v1_customer_shops__shop_id__shipping_configurations_default_put
      parameters:
        - name: shop_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Shop Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDefaultShippingConfigRequest"
      responses:
        "200":
          description: Default shipping configuration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResponse_SetDefaultShippingConfigResponse_"
        "404":
          description: Shop or configuration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "409":
          description: Configuration does not belong to this shop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/shops/{shop_id}/shipping-configurations/{config_id}:
    get:
      tags:
        - customer
      summary: Get shipping configuration
      description: >-
        Get a single shipping configuration by ID during onboarding. Returns configuration details
        with enriched province and country names.
      operationId: >-
        get_shipping_configuration_api_v1_customer_shops__shop_id__shipping_configurations__config_id__get
      parameters:
        - name: shop_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Shop Id
        - name: config_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Config Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Shipping configuration details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingConfigurationResponse"
        "404":
          description: Shop or configuration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    put:
      tags:
        - customer
      summary: Update shipping configuration
      description: >-
        Update a shipping configuration's prices and provinces during onboarding. Shipping type and
        country are immutable after creation. Province list is fully replaced (not merged with
        existing).
      operationId: >-
        update_shipping_configuration_api_v1_customer_shops__shop_id__shipping_configurations__config_id__put
      parameters:
        - name: shop_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Shop Id
        - name: config_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Config Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShippingConfigurationRequest"
      responses:
        "200":
          description: Shipping configuration updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResponse_ShippingConfigurationResponse_"
        "404":
          description: Shop or configuration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "409":
          description: Province conflict with another configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    delete:
      tags:
        - customer
      summary: Delete shipping configuration
      description: >-
        Delete a shipping configuration from a shop during onboarding. Cannot delete the default
        configuration (must set another as default first). Cannot delete the last configuration if
        shop is in SHIPMENT_INFO_ADDED or later state.
      operationId: >-
        delete_shipping_configuration_api_v1_customer_shops__shop_id__shipping_configurations__config_id__delete
      parameters:
        - name: shop_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Shop Id
        - name: config_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Config Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "204":
          description: Shipping configuration deleted successfully
        "404":
          description: Shop or configuration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "409":
          description: Cannot delete default or last required configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/shops/{shop_id}/request-payment:
    post:
      tags:
        - customer
      summary: Request payment for shop registration
      description: >-
        Initiate registration payment for a shop in SHIPMENT_INFO_ADDED state. Returns a payment URL
        that the user must visit to complete payment. After successful payment, the shop transitions
        to PAID state via webhook. Payment amount is determined by platform configuration.
      operationId: request_payment_api_v1_customer_shops__shop_id__request_payment_post
      parameters:
        - name: shop_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Shop Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Payment request created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResponse_RequestPaymentResponse_"
        "404":
          description: Shop not found or not owned by user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "409":
          description: Shop not in SHIPMENT_INFO_ADDED state (payment already initiated or not ready)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "503":
          description: Payment service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
  /api/v1/customer/shops/{shop_id}/activate:
    post:
      tags:
        - customer
      summary: Retry merchant registration and activate shop
      description: >-
        Retry merchant registration with GreenBank and activate a shop stuck in PAID state. Use this
        endpoint when the post-payment activation failed (e.g., GreenBank was unavailable, business
        category had no MCC configured at the time). Creates default settlement account and
        transitions shop to ACTIVE state.
      operationId: activate_shop_api_v1_customer_shops__shop_id__activate_post
      parameters:
        - name: shop_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Shop Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Shop activated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResponse_ActivateShopResponse_"
        "404":
          description: Shop not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "409":
          description: Shop not in PAID state, or missing MCC/contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "503":
          description: GreenBank service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseSchema"
  /api/v1/generic/health:
    get:
      tags:
        - generic
      summary: Health check
      description: Returns service health status
      operationId: health_check_api_v1_generic_health_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/core__api__v1__generic__schemas__HealthResponse"
      parameters:
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
  /api/v1/generic/business-categories:
    get:
      tags:
        - generic
      summary: List active business categories
      description: >-
        List all active business categories for shop classification. Returns only active categories
        for merchant dropdown selection. No authentication required.
      operationId: list_active_business_categories_api_v1_generic_business_categories_get
      responses:
        "200":
          description: List of active business categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionResponse_ActiveBusinessCategoryResponse_"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      parameters:
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
  /api/v1/generic/shipping-methods:
    get:
      tags:
        - generic
      summary: List available shipping methods
      description: >-
        List all available shipping methods (courier providers) for shipping configuration. Returns
        code and Persian label for each method. No authentication required.
      operationId: list_shipping_methods_api_v1_generic_shipping_methods_get
      responses:
        "200":
          description: List of available shipping methods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionResponse_ShippingMethodResponse_"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      parameters:
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
  /api/v1/generic/shops:
    get:
      tags:
