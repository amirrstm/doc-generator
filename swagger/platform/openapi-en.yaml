components:
  schemas:
    Auth_AnonymousLoginRequest:
      properties:
        user_id:
          type: string
          title: User Id
        device_fingerprint:
          type: string
          nullable: true
          title: Device Fingerprint
      type: object
      required:
        - user_id
      title: AnonymousLoginRequest
    Auth_AnonymousRegisterRequest:
      properties:
        device_fingerprint:
          type: string
          nullable: true
          title: Device Fingerprint
      type: object
      title: AnonymousRegisterRequest
    Auth_AssignRolesRequest:
      properties:
        roles:
          items:
            type: string
          type: array
          minItems: 1
          title: Roles
      type: object
      required:
        - roles
      title: AssignRolesRequest
    Auth_ChangeOwnPasswordRequest:
      properties:
        old_password:
          type: string
          title: Old Password
        new_password:
          type: string
          minLength: 8
          title: New Password
      type: object
      required:
        - old_password
        - new_password
      title: ChangeOwnPasswordRequest
    Auth_ChangePasswordRequest:
      properties:
        old_password:
          type: string
          title: Old Password
        new_password:
          type: string
          minLength: 8
          title: New Password
      type: object
      required:
        - old_password
        - new_password
      title: ChangePasswordRequest
    Auth_ConvertUserRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
        username:
          type: string
          maxLength: 50
          minLength: 3
          title: Username
        password:
          type: string
          minLength: 8
          title: Password
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
      type: object
      required:
        - email
        - username
        - password
        - first_name
        - last_name
      title: ConvertUserRequest
    Auth_CreateOrgOwnerRequest:
      properties:
        username:
          type: string
          minLength: 1
          title: Username
        email:
          type: string
          nullable: true
          title: Email
        password:
          type: string
          nullable: true
          title: Password
        first_name:
          type: string
          maxLength: 100
          minLength: 1
          title: First Name
        last_name:
          type: string
          maxLength: 100
          minLength: 1
          title: Last Name
      type: object
      required:
        - username
        - first_name
        - last_name
      title: CreateOrgOwnerRequest
    Auth_CreateRealmRequest:
      properties:
        slug:
          type: string
          maxLength: 63
          minLength: 3
          title: Slug
        display_name:
          type: string
          maxLength: 255
          minLength: 1
          title: Display Name
        enabled:
          type: boolean
          nullable: true
          title: Enabled
      type: object
      required:
        - slug
        - display_name
      title: CreateRealmRequest
    Auth_CreateUserRequest:
      properties:
        username:
          type: string
          maxLength: 50
          minLength: 3
          title: Username
        email:
          type: string
          format: email
          title: Email
        first_name:
          type: string
          maxLength: 100
          minLength: 1
          title: First Name
        last_name:
          type: string
          maxLength: 100
          minLength: 1
          title: Last Name
        enabled:
          type: boolean
          nullable: true
          title: Enabled
        password:
          type: string
          minLength: 8
          title: Password
        roles:
          items:
            type: string
          type: array
          nullable: true
          title: Roles
      type: object
      required:
        - username
        - email
        - first_name
        - last_name
        - password
      title: CreateUserRequest
    Auth_HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/Auth_ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Auth_ImpersonateUserRequest:
      properties:
        username:
          type: string
          minLength: 1
          title: Username
          description: The customer's username (mobile number or email address).
      type: object
      required:
        - username
      title: ImpersonateUserRequest
    Auth_ImpersonateUserResponse:
      type: object
      title: ImpersonateUserResponse
      properties:
        access_token:
          type: string
          description: JWT access token. Use as Bearer token for all subsequent API calls.
        expires_in:
          type: integer
          description: Access token expiry time in seconds.
        refresh_expires_in:
          type: integer
          description: Refresh token expiry time in seconds.
        refresh_token:
          type: string
          description: JWT refresh token for obtaining new access tokens.
        token_type:
          type: string
          description: Token type (always "Bearer").
        session_state:
          type: string
          description: Session identifier.
        scope:
          type: string
          description: Granted OAuth scopes.
    Auth_LoginRequest:
      properties:
        username:
          type: string
          title: Username
        password:
          type: string
          title: Password
      type: object
      required:
        - username
        - password
      title: LoginRequest
    Auth_LogoutRequest:
      properties:
        refresh_token:
          type: string
          title: Refresh Token
      type: object
      required:
        - refresh_token
      title: LogoutRequest
    Auth_LookupUsersRequest:
      properties:
        user_ids:
          items:
            type: string
          type: array
          nullable: true
          title: User Ids
        emails:
          items:
            type: string
          type: array
          nullable: true
          title: Emails
      type: object
      title: LookupUsersRequest
    Auth_OnboardRealmResponse:
      type: object
      title: OnboardRealmResponse
      properties:
        data:
          type: object
          properties:
            realm:
              type: object
              properties:
                slug:
                  type: string
                  description: Unique realm identifier (the Paystar customer's user_id).
                display_name:
                  type: string
                  description: Human-readable realm name.
                enabled:
                  type: boolean
                  description: Whether the realm is active.
                created_at:
                  type: string
                  nullable: true
                  description: Realm creation timestamp.
                user_count:
                  type: integer
                  description: Number of users in the realm.
            owner:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Unique owner user ID.
                roles:
                  type: array
                  items:
                    type: string
                  description: Assigned roles for the owner.
                realm_id:
                  type: string
                  description: The realm this owner belongs to.
                email:
                  type: string
                  description: Owner email address.
                username:
                  type: string
                  description: Owner username (mobile or email).
                enabled:
                  type: boolean
                  description: Whether the owner account is active.
                last_name:
                  type: string
                  description: Owner last name.
                first_name:
                  type: string
                  description: Owner first name.
                created_at:
                  type: integer
                  description: Owner creation timestamp (epoch ms).
        metadata:
          type: object
          properties:
            request_id:
              type: string
              format: uuid
              description: Unique request tracking ID.
            timestamp:
              type: string
              format: date-time
              description: Server timestamp of the response.
            processing_time_ms:
              type: number
              nullable: true
              description: Request processing time in milliseconds.
    Auth_OnboardRealmRequest:
      properties:
        slug:
          type: string
          maxLength: 63
          minLength: 1
          title: Slug
          description: Unique identifier for the realm. Use the Paystar customer's user_id.
        display_name:
          type: string
          maxLength: 255
          minLength: 1
          title: Display Name
          description: Human-readable name for the realm (e.g. company name).
        owner_username:
          type: string
          minLength: 1
          title: Owner Username
          description: Username for the realm owner. Can be a mobile number or email address of the customer.
        first_name:
          type: string
          maxLength: 100
          minLength: 1
          title: First Name
          description: First name of the realm owner (optional).
          nullable: true
        last_name:
          type: string
          maxLength: 100
          minLength: 1
          title: Last Name
          description: Last name of the realm owner (optional).
          nullable: true
      type: object
      required:
        - slug
        - display_name
        - owner_username
      title: OnboardRealmRequest
    Auth_RefreshTokenRequest:
      properties:
        refresh_token:
          type: string
          title: Refresh Token
      type: object
      required:
        - refresh_token
      title: RefreshTokenRequest
    Auth_RegisterRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
        username:
          type: string
          maxLength: 50
          minLength: 3
          title: Username
        password:
          type: string
          minLength: 8
          title: Password
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
        phone:
          type: string
          nullable: true
          title: Phone
      type: object
      required:
        - email
        - username
        - password
        - first_name
        - last_name
      title: RegisterRequest
    Auth_RemoveRolesRequest:
      properties:
        roles:
          items:
            type: string
          type: array
          minItems: 1
          title: Roles
      type: object
      required:
        - roles
      title: RemoveRolesRequest
    Auth_UpdateOwnProfileRequest:
      properties:
        first_name:
          type: string
          maxLength: 100
          minLength: 1
          nullable: true
          title: First Name
        last_name:
          type: string
          maxLength: 100
          minLength: 1
          nullable: true
          title: Last Name
      type: object
      title: UpdateOwnProfileRequest
    Auth_UpdateProfileRequest:
      properties:
        first_name:
          type: string
          maxLength: 100
          minLength: 1
          nullable: true
          title: First Name
        last_name:
          type: string
          maxLength: 100
          minLength: 1
          nullable: true
          title: Last Name
      type: object
      title: UpdateProfileRequest
    Auth_UpdateRealmRequest:
      properties:
        display_name:
          type: string
          maxLength: 255
          minLength: 1
          nullable: true
          title: Display Name
        enabled:
          type: boolean
          nullable: true
          title: Enabled
      type: object
      title: UpdateRealmRequest
    Auth_UpdateUserRequest:
      properties:
        email:
          type: string
          format: email
          nullable: true
          title: Email
        first_name:
          type: string
          maxLength: 100
          minLength: 1
          nullable: true
          title: First Name
        last_name:
          type: string
          maxLength: 100
          minLength: 1
          nullable: true
          title: Last Name
        enabled:
          type: boolean
          nullable: true
          title: Enabled
      type: object
      title: UpdateUserRequest
    Auth_ValidateTokenRequest:
      properties:
        token:
          type: string
          title: Token
      type: object
      required:
        - token
      title: ValidateTokenRequest
    Auth_ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
    Config_AgentSummary:
      type: object
      description: Response serializer for agent summary in widget config.
      properties:
        id:
          type: string
          format: uuid
          description: Agent UUID
        title:
          type: string
          description: Agent display name
        slug:
          type: string
          description: Agent slug
      required:
        - id
        - slug
        - title
    Config_AppConfig:
      type: object
      description: Response serializer for a single app config with full details.
      properties:
        id:
          type: string
          format: uuid
          description: App config UUID
        token:
          type: string
          format: uuid
          description: Immutable app config token
        title:
          type: string
          nullable: true
          description: App title
        language:
          type: string
          nullable: true
          description: App language
        app_domain:
          type: string
          nullable: true
          description: App domain
        is_active:
          type: boolean
          description: Whether app config is enabled
        theme:
          nullable: true
          description: Theme configuration
        welcome:
          nullable: true
          description: Welcome configuration as array (use is_default)
        settings:
          nullable: true
          description: Settings configuration
        realm:
          type: string
          description: Tenant identifier
        created_at:
          type: string
          format: date-time
          nullable: true
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Last update timestamp
        agent:
          allOf:
            - $ref: '#/components/schemas/Config_AgentSummary'
          nullable: true
          description: Related agent summary
        logo:
          allOf:
            - $ref: '#/components/schemas/Config_FileDetail'
          nullable: true
          description: Logo file details
      required:
        - id
        - realm
        - token
    Config_AppConfigListItem:
      type: object
      description: Response serializer for app config in list (minimal fields).
      properties:
        id:
          type: string
          format: uuid
          description: App config UUID
        token:
          type: string
          format: uuid
          description: Immutable app config token
        title:
          type: string
          nullable: true
          description: App title
        language:
          type: string
          nullable: true
          description: App language
        app_domain:
          type: string
          nullable: true
          description: App domain
        is_active:
          type: boolean
          description: Whether app config is enabled
        realm:
          type: string
          description: Tenant identifier
        created_at:
          type: string
          format: date-time
          nullable: true
          description: Creation timestamp
        agent:
          allOf:
            - $ref: '#/components/schemas/Config_AgentSummary'
          nullable: true
          description: Related agent summary
        logo:
          allOf:
            - $ref: '#/components/schemas/Config_FileSummary'
          nullable: true
          description: Logo file summary
      required:
        - id
        - realm
        - token
    Config_AppConfigListResponse:
      type: object
      description: Response serializer for paginated app config list.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Config_AppConfigListItem'
          description: List of app configs
        pagination:
          allOf:
            - $ref: '#/components/schemas/Config_AppConfigPagination'
          description: Pagination metadata
      required:
        - data
        - pagination
    Config_AppConfigPagination:
      type: object
      description: Pagination metadata serializer.
      properties:
        page:
          type: integer
          description: Current page number
        page_size:
          type: integer
          description: Items per page
        total:
          type: integer
          description: Total number of items
        total_pages:
          type: integer
          description: Total number of pages
        has_next:
          type: boolean
          description: Has next page
        has_prev:
          type: boolean
          description: Has previous page
      required:
        - has_next
        - has_prev
        - page
        - page_size
        - total
        - total_pages
    Config_AuthModeEnum:
      enum:
        - ANONYMOUS
        - PREMIUM
        - FREEMIUM
      type: string
      description: |-
        * `ANONYMOUS` - ANONYMOUS
        * `PREMIUM` - PREMIUM
        * `FREEMIUM` - FREEMIUM
    Config_BubbleTypeEnum:
      enum:
        - IMAGE
        - SVG
      type: string
      description: |-
        * `IMAGE` - IMAGE
        * `SVG` - SVG
    Config_CreateAppConfigRequest:
      type: object
      description: Request serializer for creating an app config.
      properties:
        agent_id:
          type: string
          format: uuid
          description: Agent UUID this app config belongs to
        logo_id:
          type: string
          format: uuid
          nullable: true
          description: File UUID for app logo
        title:
          type: string
          nullable: true
          description: Optional app title
          maxLength: 255
        language:
          nullable: true
          description: |-
            App language (EN/FA)

            * `EN` - EN
            * `FA` - FA
          oneOf:
            - $ref: '#/components/schemas/Config_LanguageEnum'
            - $ref: '#/components/schemas/Config_NullEnum'
        app_domain:
          type: string
          nullable: true
          description: Optional app domain
          maxLength: 255
        is_active:
          type: boolean
          default: true
          description: Whether app config is enabled
        theme:
          nullable: true
          description: Theme configuration as JSON
        welcome:
          nullable: true
          description: Welcome configuration as JSON array (use is_default)
        settings:
          nullable: true
          description: Settings configuration as JSON
      required:
        - agent_id
    Config_CreateTenantRequest:
      type: object
      description: Request serializer for creating a tenant.
      properties:
        name:
          type: string
          maxLength: 255
        enabled:
          type: boolean
          default: true
        requests_per_minute:
          type: integer
          minimum: 1
        burst_allowance:
          type: integer
          minimum: 0
        domains:
          type: array
          items:
            $ref: '#/components/schemas/Config_DomainsEnum'
      required:
        - burst_allowance
        - name
        - requests_per_minute
    Config_CreateWidgetConfigRequest:
      type: object
      description: |-
        Request serializer for creating a widget config with nested entities.

        Note: slug is auto-generated from brand_name and is not accepted in requests.
      properties:
        agent_id:
          type: string
          format: uuid
          description: Agent UUID this widget belongs to
        brand_name:
          type: string
          description: Brand name displayed in the widget (slug is auto-generated from this)
          maxLength: 255
        auth_mode:
          allOf:
            - $ref: '#/components/schemas/Config_AuthModeEnum'
          description: |-
            Authentication mode for widget users

            * `ANONYMOUS` - ANONYMOUS
            * `PREMIUM` - PREMIUM
            * `FREEMIUM` - FREEMIUM
        logo_id:
          type: string
          format: uuid
          nullable: true
          description: File UUID for widget logo
        title:
          type: string
          nullable: true
          description: Optional title for the widget
          maxLength: 255
        language:
          nullable: true
          description: |-
            Widget language (EN/FA)

            * `EN` - EN
            * `FA` - FA
          oneOf:
            - $ref: '#/components/schemas/Config_LanguageEnum'
            - $ref: '#/components/schemas/Config_NullEnum'
        theme:
          nullable: true
          description: Theme configuration as JSON
        config:
          nullable: true
          description: Additional configuration as JSON
        is_active:
          type: boolean
          default: true
          description: Whether the widget is enabled
        show_on_mobile:
          type: boolean
          default: true
          description: Whether to show widget on mobile devices
        full_screen_on_mobile:
          type: boolean
          default: false
          description: Whether to use full screen mode on mobile
        mobile_position:
          nullable: true
          description: 'Mobile position configuration as JSON (e.g., {bottom: 20, right: 20})'
        bubble:
          allOf:
            - $ref: '#/components/schemas/Config_WidgetBubbleRequest'
          nullable: true
          description: Widget bubble configuration
        welcome_messages:
          type: array
          items:
            $ref: '#/components/schemas/Config_WelcomeMessageRequest'
          nullable: true
          description: Welcome messages (one per language)
      required:
        - agent_id
        - auth_mode
        - brand_name
    Config_DomainsEnum:
      enum:
        - product
        - document
      type: string
      description: |-
        * `product` - product
        * `document` - document
    Config_File:
      type: object
      description: Response serializer for a single file.
      properties:
        id:
          type: string
          format: uuid
          description: File UUID
        filename:
          type: string
          description: Original filename
        content_type:
          type: string
          description: MIME type
        size:
          type: integer
          description: File size in bytes
        path:
          type: string
          description: Storage path
        realm:
          type: string
          description: Tenant identifier
        created_at:
          type: string
          format: date-time
          nullable: true
          description: Upload timestamp
      required:
        - content_type
        - filename
        - id
        - path
        - realm
        - size
    Config_FileDetail:
      type: object
      description: Response serializer for file with full details.
      properties:
        id:
          type: string
          format: uuid
          description: File UUID
        filename:
          type: string
          description: Original filename
        content_type:
          type: string
          description: MIME type
        path:
          type: string
          description: Storage path
      required:
        - content_type
        - filename
