openapi: 3.0.3
info:
  title: Felesh Platform API
  version: 1.0.0
  description: >-
    Unified API documentation for the Felesh platform. Covers Authentication, Config Store, RAG, Social Gateway, and
    Interaction History services.
servers:
  - url: https://api.paystar.stg.felesh.ai
    description: Staging
  - url: https://api.paystar.felesh.ai
    description: Production
paths:
  /auth/api/v1/staff/realms/onboard:
    post:
      tags:
        - Onboarding
      summary: Onboard Realm
      operationId: onboard_realm_api_v1_staff_realms_onboard_post
      parameters:
        - name: X-Client-Id
          in: header
          required: false
          schema:
            type: string
            nullable: true
            title: X-Client-Id
        - name: X-Client-Secret
          in: header
          required: false
          schema:
            type: string
            nullable: true
            title: X-Client-Secret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth_OnboardRealmRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_OnboardRealmResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_HTTPValidationError'
  /auth/api/v1/staff/realms/{slug}/impersonate:
    post:
      tags:
        - Onboarding
      summary: Impersonate User
      operationId: impersonate_user_api_v1_staff_realms__slug__impersonate_post
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            title: Slug
          description: The realm slug (Paystar customer's user_id) returned from the onboard response.
        - name: X-Client-Id
          in: header
          required: false
          schema:
            type: string
            nullable: true
            title: X-Client-Id
        - name: X-Client-Secret
          in: header
          required: false
          schema:
            type: string
            nullable: true
            title: X-Client-Secret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth_ImpersonateUserRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_ImpersonateUserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_HTTPValidationError'
  /config/api/v1/org/tenants/:
    get:
      operationId: get_tenant_by_realm
      description: Get the tenant associated with the current realm.
      summary: Get tenant by realm
      tags:
        - Config Store
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: 'Bearer token from impersonate response (e.g. Bearer eyJhbG...)'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config_Tenant'
          description: Tenant details
        '401':
          description: Authentication required
        '404':
          description: Not found
    post:
      operationId: create_tenant
      description: Create a new tenant for the current realm.
      summary: Create tenant
      tags:
        - Config Store
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: 'Bearer token from impersonate response (e.g. Bearer eyJhbG...)'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Config_CreateTenantRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config_Tenant'
          description: Tenant created
        '400':
          description: Validation error
        '401':
          description: Authentication required
        '409':
          description: Tenant API key already exists
  /config/api/v1/org/tenants/{tenant_id}/:
    delete:
      operationId: delete_tenant
      description: Delete a tenant by ID.
      summary: Delete tenant
      parameters:
        - in: path
          name: tenant_id
          schema:
            type: string
          required: true
          description: The tenant ID to delete.
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: 'Bearer token from impersonate response (e.g. Bearer eyJhbG...)'
      tags:
        - Config Store
      responses:
        '200':
          description: Tenant deleted
        '401':
          description: Authentication required
        '404':
          description: Not found
  /rag/api/v1/ingest/files:
    post:
      tags:
        - RAG
      summary: Ingest File
      description: >-
        Upload a file for ingestion into the specified domain. Supports PDF, TXT, CSV, JSON, JSONL
        and other document formats up to 100MB. The file is validated and queued for asynchronous
        processing. Returns a task ID for polling status via GET /tasks/{task_id}.
      operationId: ingest_file_api_v1_ingest_files_post
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Bearer token obtained from the Impersonate User endpoint.
          schema:
            type: string
            example: Bearer eyJhbGciOiJSUzI1NiIs...
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RAG_Body_ingest_file_api_v1_ingest_files_post'
        required: true
      responses:
        '200':
          description: File submitted successfully for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RAG_IngestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RAG_HTTPValidationError'
  /rag/api/v1/ingest/records:
    post:
      tags:
        - RAG
      summary: Ingest Records
      description: >-
        Ingest an array of JSON records into the specified domain. Records are validated against
        the domain schema before task creation. Maximum 1000 records per request. Returns a task
        ID for polling status via GET /tasks/{task_id}.
      operationId: ingest_records_api_v1_ingest_records_post
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Bearer token obtained from the Impersonate User endpoint.
          schema:
            type: string
            example: Bearer eyJhbGciOiJSUzI1NiIs...
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RAG_IngestRecordsRequest'
        required: true
      responses:
        '200':
          description: Records validated and submitted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RAG_IngestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RAG_HTTPValidationError'
  /rag/api/v1/search:
    post:
      tags:
        - RAG
      summary: Search
      description: >-
        Perform hybrid semantic search (embedding + BM25) across the specified domain.
        Returns ranked results with relevance scores and metadata. Supports optional
        metadata filters and configurable result count.
      operationId: search_api_v1_search_post
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Bearer token obtained from the Impersonate User endpoint.
          schema:
            type: string
            example: Bearer eyJhbGciOiJSUzI1NiIs...
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RAG_SearchRequest'
        required: true
      responses:
        '200':
          description: Search completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RAG_SearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RAG_HTTPValidationError'
  /rag/api/v1/tasks/{task_id}:
    get:
      tags:
        - RAG
      summary: Get Task Status
      description: >-
        Retrieve the status of an asynchronous ingestion task. Tasks are created by the
        Ingest File and Ingest Records endpoints. Poll this endpoint to track progress
        and get results. Status values: pending, processing, completed, failed, cancelled.
      operationId: get_task_status_api_v1_tasks__task_id__get
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Bearer token obtained from the Impersonate User endpoint.
          schema:
            type: string
            example: Bearer eyJhbGciOiJSUzI1NiIs...
        - name: task_id
          in: path
          required: true
          description: Unique task identifier returned from an ingestion endpoint.
          schema:
            type: string
            example: batch_a1b2c3d4e5f6
      responses:
        '200':
          description: Task status retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RAG_TaskStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RAG_HTTPValidationError'
  /social/api/v1/platform/instagram/accounts:
    get:
      tags:
        - Social - Instagram
      summary: List Instagram accounts
      description: List all Instagram accounts for the authenticated customer.
      operationId: list_accounts_api_v1_platform_instagram_accounts_get
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            nullable: true
            title: User Id
        - name: Authorization
          in: header
          required: true
          description: Bearer token obtained from the Impersonate User endpoint.
          schema:
            type: string
            example: 'Bearer eyJhbGciOiJSUzI1NiIs...'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Social_MetaAccountListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Social_HTTPValidationError'
  /social/api/v1/platform/instagram/accounts/{account_id}:
    get:
      tags:
        - Social - Instagram
      summary: Get Instagram account
      description: Get details of a specific Instagram account.
      operationId: get_account_api_v1_platform_instagram_accounts__account_id__get
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
            title: Account Id
        - name: Authorization
          in: header
          required: true
          description: Bearer token obtained from the Impersonate User endpoint.
          schema:
            type: string
            example: 'Bearer eyJhbGciOiJSUzI1NiIs...'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Social_MetaAccountResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Social_HTTPValidationError'
    delete:
      tags:
        - Social - Instagram
      summary: Disconnect Instagram account
      description: Disconnect an Instagram account (deactivates webhook processing).
      operationId: disconnect_account_api_v1_platform_instagram_accounts__account_id__delete
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
            title: Account Id
        - name: Authorization
          in: header
          required: true
          description: Bearer token obtained from the Impersonate User endpoint.
          schema:
            type: string
            example: 'Bearer eyJhbGciOiJSUzI1NiIs...'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Social_DisconnectAccountResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Social_HTTPValidationError'
  /social/api/v1/platform/instagram/posts:
    get:
      tags:
        - Social - Instagram
      summary: List Instagram posts
      description: List Instagram posts for a connected account.
      operationId: list_posts_api_v1_platform_instagram_posts_get
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 25
            title: Limit
        - name: after
          in: query
          required: false
          schema:
            type: string
            nullable: true
            title: After
        - name: Authorization
          in: header
          required: true
          description: Bearer token obtained from the Impersonate User endpoint.
          schema:
            type: string
            example: 'Bearer eyJhbGciOiJSUzI1NiIs...'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Social_InstagramPostListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Social_HTTPValidationError'
    post:
      tags:
        - Social - Instagram
      summary: Create Instagram post
      description: Create and publish an Instagram image post.
      operationId: create_post_api_v1_platform_instagram_posts_post
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Bearer token obtained from the Impersonate User endpoint.
          schema:
            type: string
            example: 'Bearer eyJhbGciOiJSUzI1NiIs...'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Social_InstagramPostCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Social_InstagramPostCreateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Social_HTTPValidationError'
  /social/api/v1/platform/instagram/user-info:
    get:
      tags:
        - Social - Instagram
      summary: Get Instagram user info
      description: Fetch Instagram user info for the connected account.
      operationId: get_user_info_api_v1_platform_instagram_user_info_get
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Bearer token obtained from the Impersonate User endpoint.
          schema:
            type: string
            example: 'Bearer eyJhbGciOiJSUzI1NiIs...'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get User Info Api V1 Platform Instagram User Info Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Social_HTTPValidationError'
  /social/api/v1/platform/instagram/oauth/connect:
    get:
      tags:
        - Social - Instagram
      summary: Start Instagram OAuth
      description: Start the Instagram OAuth flow. Requires a single-use OAuth token.
      operationId: instagram_connect_api_v1_platform_instagram_oauth_connect_get
      parameters:
        - name: callback_url
          in: query
          required: true
          schema:
            type: string
            description: URL to redirect after OAuth
            title: Callback Url
          description: URL to redirect after OAuth
        - name: store_id
          in: query
          required: false
          schema:
            type: string
            nullable: true
            description: End-user's store ID (optional)
            title: Store Id
          description: End-user's store ID (optional)
        - name: store_api_key
          in: query
          required: false
          schema:
            type: string
            nullable: true
            description: End-user's store API key (optional)
            title: Store Api Key
          description: End-user's store API key (optional)
        - name: state
          in: query
          required: false
          schema:
            type: string
            nullable: true
            description: Optional pass-through state
            title: State
          description: Optional pass-through state
        - name: Authorization
          in: header
          required: true
          description: Bearer token obtained from the Impersonate User endpoint.
          schema:
            type: string
            example: 'Bearer eyJhbGciOiJSUzI1NiIs...'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Social_HTTPValidationError'
  /interaction/api/v1/org/interactions:
    get:
      tags:
        - Interaction History
      summary: List interactions in realm
      description: List all interactions in the realm with optional user_id filter, search, sorting, and pagination.
      operationId: list_interactions_api_v1_org_interactions_get
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            nullable: true
            description: Filter by user ID
            title: User Id
          description: Filter by user ID
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            description: Page number
            default: 1
            title: Page
          description: Page number
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            description: Items per page
            default: 20
            title: Page Size
          description: Items per page
        - name: search
          in: query
          required: false
          schema:
            type: string
            nullable: true
            description: Case-insensitive search across title, description, tags, and interaction_id
            title: Search
          description: Case-insensitive search across title, description, tags, and interaction_id
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            description: Sort field
            default: created_at
            title: Sort By
          description: Sort field
        - name: sort_order
          in: query
          required: false
          schema:
            type: string
            description: Sort order (asc/desc)
            default: desc
            title: Sort Order
          description: Sort order (asc/desc)
        - name: Authorization
          in: header
          required: true
          description: Bearer token obtained from the Impersonate User endpoint.
          schema:
            type: string
            example: 'Bearer eyJhbGciOiJSUzI1NiIs...'
      responses:
        '200':
          description: Paginated list of interactions with their last message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction_PaginatedInteractionListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction_HTTPValidationError'
    post:
      tags:
        - Interaction History
      summary: Create a new interaction
      description: Create a new interaction. Optionally specify user_id to create for another user.
      operationId: create_interaction_api_v1_org_interactions_post
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Bearer token obtained from the Impersonate User endpoint.
          schema:
            type: string
            example: 'Bearer eyJhbGciOiJSUzI1NiIs...'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Interaction_OrgCreateInteractionRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction_HTTPValidationError'
  /interaction/api/v1/org/interactions/statistics:
    get:
      tags:
        - Interaction History
      summary: Get interaction statistics
      description: Get counts for total, today, active, archived, and deleted interactions in the realm.
      operationId: get_interaction_statistics_api_v1_org_interactions_statistics_get
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            nullable: true
            description: Filter statistics by user ID
            title: User Id
          description: Filter statistics by user ID
        - name: Authorization
          in: header
          required: true
          description: Bearer token obtained from the Impersonate User endpoint.
          schema:
            type: string
            example: 'Bearer eyJhbGciOiJSUzI1NiIs...'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction_HTTPValidationError'
  /interaction/api/v1/org/interactions/{interaction_id}:
    get:
      tags:
        - Interaction History
      summary: Get interaction by ID
      description: Get any interaction in the realm by ID.
      operationId: get_interaction_api_v1_org_interactions__interaction_id__get
      parameters:
        - name: interaction_id
          in: path
          required: true
          schema:
            type: string
            title: Interaction Id
        - name: Authorization
          in: header
          required: true
          description: Bearer token obtained from the Impersonate User endpoint.
          schema:
            type: string
            example: 'Bearer eyJhbGciOiJSUzI1NiIs...'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction_HTTPValidationError'
    patch:
      tags:
        - Interaction History
      summary: Update an interaction
      description: Update any interaction in the realm.
      operationId: update_interaction_api_v1_org_interactions__interaction_id__patch
      parameters:
        - name: interaction_id
          in: path
          required: true
          schema:
            type: string
            title: Interaction Id
        - name: Authorization
          in: header
          required: true
          description: Bearer token obtained from the Impersonate User endpoint.
          schema:
            type: string
            example: 'Bearer eyJhbGciOiJSUzI1NiIs...'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Interaction_UpdateInteractionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction_HTTPValidationError'
    delete:
      tags:
        - Interaction History
      summary: Delete an interaction
      description: Soft delete any interaction in the realm.
      operationId: delete_interaction_api_v1_org_interactions__interaction_id__delete
      parameters:
        - name: interaction_id
          in: path
          required: true
          schema:
            type: string
            title: Interaction Id
        - name: Authorization
          in: header
          required: true
          description: Bearer token obtained from the Impersonate User endpoint.
          schema:
            type: string
            example: 'Bearer eyJhbGciOiJSUzI1NiIs...'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction_HTTPValidationError'
  /interaction/api/v1/org/interactions/{interaction_id}/archive:
    post:
      tags:
        - Interaction History
      summary: Archive an interaction
      description: Archive any interaction in the realm.
      operationId: archive_interaction_api_v1_org_interactions__interaction_id__archive_post
      parameters:
        - name: interaction_id
          in: path
          required: true
          schema:
            type: string
            title: Interaction Id
        - name: Authorization
          in: header
          required: true
          description: Bearer token obtained from the Impersonate User endpoint.
          schema:
            type: string
            example: 'Bearer eyJhbGciOiJSUzI1NiIs...'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction_HTTPValidationError'
  /interaction/api/v1/org/interactions/{interaction_id}/messages:
    get:
      tags:
        - Interaction History
      summary: List messages for an interaction
      description: List all messages in any interaction in the realm.
      operationId: list_messages_api_v1_org_interactions__interaction_id__messages_get
      parameters:
        - name: interaction_id
          in: path
          required: true
          schema:
            type: string
            title: Interaction Id
        - name: include_deleted
          in: query
          required: false
          schema:
            type: boolean
            description: Include deleted messages
            default: false
            title: Include Deleted
          description: Include deleted messages
        - name: Authorization
          in: header
          required: true
          description: Bearer token obtained from the Impersonate User endpoint.
          schema:
            type: string
            example: 'Bearer eyJhbGciOiJSUzI1NiIs...'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
