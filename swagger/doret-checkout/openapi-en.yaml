          type: string
          title: Currency Code
        shops:
          items:
            $ref: "#/components/schemas/ShopShippingConfirmationSchema"
          type: array
          title: Shops
        next_step:
          type: string
          title: Next Step
      type: object
      required:
        - checkout_id
        - status
        - shipping_total_minor
        - currency_code
        - shops
        - next_step
      title: SelectShippingMethodsResponse
      description: Response for shipping methods selection.
    ShippingOptionSchema:
      properties:
        method_id:
          type: string
          title: Method Id
        name:
          type: string
          title: Name
        fee_minor:
          type: integer
          title: Fee Minor
        estimated_days:
          type: integer
          title: Estimated Days
        is_default:
          type: boolean
          title: Is Default
          default: false
      type: object
      required:
        - method_id
