  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    XDoretClientType:
      name: x-doret-client-type
      in: header
      required: false
      schema:
        type: string
        example: app
      description: Client type identifier
    XDoretMainSocialId:
      name: x-doret-main-social-id
      in: header
      required: false
      schema:
        type: string
        format: uuid
        example: 019c7609-d734-76a0-9276-32183ac26e04
      description: Main social ID
    XDoretBusinessSocialId:
      name: X-Doret-Business-Social-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Business social ID
security:
  - BearerAuth: []
  - {}
