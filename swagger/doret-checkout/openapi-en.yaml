openapi: 3.1.0
info:
  title: Checkout Service
  version: 1.0.0
paths:
  /api/v1/common/health:
    get:
      tags:
        - common
      summary: Health Check
      description: Health check endpoint
      operationId: health_check_api_v1_common_health_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
      parameters:
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
  /api/v1/customer/checkouts:
    post:
      tags:
        - customer
      summary: Initiate checkout
      description: Initiate a new checkout session from customer's cart.
      operationId: initiate_checkout_api_v1_customer_checkouts_post
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponseSchema_InitiateCheckoutResponse_"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      parameters:
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
  /api/v1/customer/checkouts/{checkout_id}:
    get:
      tags:
        - customer
      summary: Get checkout status
      description: Get full checkout session status and details.
      operationId: get_checkout_status_api_v1_customer_checkouts__checkout_id__get
      parameters:
        - name: checkout_id
          in: path
          required: true
          schema:
            type: string
            title: Checkout Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutStatusResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/checkouts/{checkout_id}:validate-products:
    post:
      tags:
        - customer
      summary: Validate products
      description: Validate all products in the checkout session against catalog.
      operationId: validate_products_api_v1_customer_checkouts__checkout_id__validate_products_post
      parameters:
        - name: checkout_id
          in: path
          required: true
          schema:
            type: string
            title: Checkout Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponseSchema_ValidateProductsResponse_"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/checkouts/{checkout_id}/address:
    post:
      tags:
        - customer
      summary: Select shipping address
      description: Select and validate shipping address for checkout.
      operationId: select_address_api_v1_customer_checkouts__checkout_id__address_post
      parameters:
        - name: checkout_id
          in: path
          required: true
          schema:
            type: string
            title: Checkout Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectAddressRequest"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponseSchema_SelectAddressResponse_"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/checkouts/{checkout_id}/shipping-options:
    get:
      tags:
        - customer
      summary: Get shipping options
      description: Get available shipping methods for each shop in checkout.
      operationId: get_shipping_options_api_v1_customer_checkouts__checkout_id__shipping_options_get
      parameters:
        - name: checkout_id
          in: path
          required: true
          schema:
            type: string
            title: Checkout Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingOptionsResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/checkouts/{checkout_id}/shipping-methods:
    post:
      tags:
        - customer
      summary: Select shipping methods
      description: Select shipping method for each shop in checkout.
      operationId: select_shipping_methods_api_v1_customer_checkouts__checkout_id__shipping_methods_post
      parameters:
        - name: checkout_id
          in: path
          required: true
          schema:
            type: string
            title: Checkout Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectShippingMethodsRequest"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponseSchema_SelectShippingMethodsResponse_"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/checkouts/{checkout_id}/totals:
    post:
      tags:
        - customer
      summary: Calculate checkout totals
      description: Calculate and return checkout totals with optional coupon.
      operationId: calculate_totals_api_v1_customer_checkouts__checkout_id__totals_post
      parameters:
        - name: checkout_id
          in: path
          required: true
          schema:
            type: string
            title: Checkout Id
        - name: coupon_code
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: Optional coupon code to apply
            title: Coupon Code
          description: Optional coupon code to apply
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponseSchema_TotalsResponse_"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/checkouts/{checkout_id}:confirm-changes:
    post:
      tags:
        - customer
      summary: Confirm cart changes
      description: Detect and confirm cart changes during checkout.
      operationId: confirm_changes_api_v1_customer_checkouts__checkout_id__confirm_changes_post
      parameters:
        - name: checkout_id
          in: path
          required: true
          schema:
            type: string
            title: Checkout Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmChangesRequest"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponseSchema_ConfirmChangesResponse_"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/checkouts/{checkout_id}:pay:
    post:
      tags:
        - customer
      summary: Initiate payment
      description: Initiate payment workflow for checkout.
      operationId: pay_api_v1_customer_checkouts__checkout_id__pay_post
      parameters:
        - name: checkout_id
          in: path
          required: true
          schema:
            type: string
            title: Checkout Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayRequest"
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponseSchema_PayResponse_"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/checkouts/{checkout_id}/bnpl-plans:
    get:
      tags:
        - customer
      summary: Get BNPL plans for all shops
      description: Get available BNPL plans for all shops in the checkout.
      operationId: get_checkout_bnpl_plans_api_v1_customer_checkouts__checkout_id__bnpl_plans_get
      parameters:
        - name: checkout_id
          in: path
          required: true
          schema:
            type: string
            title: Checkout Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutBnplPlansResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/checkouts/{checkout_id}/shops/{shop_id}:pay-bnpl:
    post:
      tags:
        - customer
      summary: Pay shop via BNPL
      description: Pay a single shop via BNPL within a multi-shop checkout.
      operationId: pay_bnpl_shop_api_v1_customer_checkouts__checkout_id__shops__shop_id__pay_bnpl_post
      parameters:
        - name: checkout_id
          in: path
          required: true
          schema:
            type: string
            title: Checkout Id
        - name: shop_id
          in: path
          required: true
          schema:
            type: string
            title: Shop Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayBnplShopRequest"
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponseSchema_PayBnplShopResponse_"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/customer/checkouts/{checkout_id}/shops/{shop_id}/bnpl-calculate:
    post:
      tags:
        - customer
      summary: Calculate BNPL installments
      description: Calculate BNPL installment breakdown for a shop in checkout.
      operationId: >-
        calculate_bnpl_purchase_api_v1_customer_checkouts__checkout_id__shops__shop_id__bnpl_calculate_post
      parameters:
        - name: checkout_id
          in: path
          required: true
          schema:
            type: string
            title: Checkout Id
        - name: shop_id
          in: path
          required: true
          schema:
            type: string
            title: Shop Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculateBnplRequest"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponseSchema_BnplCalculateResponse_"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/generic/health:
    get:
      tags:
        - generic
      summary: Health Check
      description: Health check endpoint.
      operationId: health_check_api_v1_generic_health_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Check Api V1 Generic Health Get
      parameters:
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
  /api/v1/generic/readiness:
    get:
      tags:
        - generic
      summary: Readiness Check
      description: Readiness check endpoint.
      operationId: readiness_check_api_v1_generic_readiness_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Readiness Check Api V1 Generic Readiness Get
      parameters:
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
  /api/v1/internal/checkouts/{checkout_id}:continue-saga:
    post:
      tags:
        - internal
      summary: Continue saga after payment success
      description: Signal the workflow to continue after successful payment callback.
      operationId: continue_saga_api_v1_internal_checkouts__checkout_id__continue_saga_post
      parameters:
        - name: checkout_id
          in: path
          required: true
          schema:
            type: string
            title: Checkout Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContinueSagaRequest"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponseSchema_ContinueSagaResponse_"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/internal/checkouts/{checkout_id}:payment-failed:
    post:
      tags:
        - internal
      summary: Handle payment failure
      description: Signal the workflow to trigger compensation after payment failure.
      operationId: payment_failed_api_v1_internal_checkouts__checkout_id__payment_failed_post
      parameters:
        - name: checkout_id
          in: path
          required: true
          schema:
            type: string
            title: Checkout Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentFailedRequest"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponseSchema_PaymentFailedResponse_"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/staff/checkouts:
    get:
      tags:
        - staff
      summary: List checkouts (staff)
      description: List checkout sessions with optional filters for staff users.
      operationId: list_checkouts_api_v1_staff_checkouts_get
      parameters:
        - name: status
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Status
        - name: social_main_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Social Main Id
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 20
            title: Limit
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
            title: Offset
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionResponseSchema_CheckoutSummarySchema_"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/staff/checkouts/{checkout_id}:
    get:
      tags:
        - staff
      summary: Get checkout details (staff)
      description: Get full checkout session details with items and shop summaries.
      operationId: get_checkout_details_api_v1_staff_checkouts__checkout_id__get
      parameters:
        - name: checkout_id
          in: path
          required: true
          schema:
            type: string
            title: Checkout Id
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutDetailsSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/staff/abuse-reports:
    get:
      tags:
        - staff
      summary: List abuse reports (staff)
      description: List customer abuse status records for staff review.
      operationId: list_abuse_reports_api_v1_staff_abuse_reports_get
      parameters:
        - name: status
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Status
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 20
            title: Limit
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
            title: Offset
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionResponseSchema_AbuseReportSchema_"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /:
    get:
      summary: Root
      description: Root endpoint
      operationId: root__get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
      parameters:
        - $ref: "#/components/parameters/XDoretClientType"
        - $ref: "#/components/parameters/XDoretMainSocialId"
        - $ref: "#/components/parameters/XDoretBusinessSocialId"
components:
  schemas:
    AbuseReportSchema:
      properties:
        social_main_id:
          type: string
          title: Social Main Id
        status:
          type: string
          title: Status
        expired_checkouts_24h:
          type: integer
          title: Expired Checkouts 24H
        expired_checkouts_7d:
          type: integer
          title: Expired Checkouts 7D
        inventory_reservation_minutes_24h:
          type: integer
          title: Inventory Reservation Minutes 24H
        cancelled_orders_7d:
          type: integer
          title: Cancelled Orders 7D
        cancelled_orders_30d:
          type: integer
          title: Cancelled Orders 30D
        last_checkout_at:
          anyOf:
            - type: string
            - type: "null"
          title: Last Checkout At
        last_abuse_event_at:
          anyOf:
            - type: string
            - type: "null"
          title: Last Abuse Event At
        blocked_at:
          anyOf:
            - type: string
            - type: "null"
          title: Blocked At
        blocked_until:
          anyOf:
            - type: string
            - type: "null"
          title: Blocked Until
        blocked_reason:
          anyOf:
            - type: string
            - type: "null"
          title: Blocked Reason
        reviewed_by:
          anyOf:
            - type: string
            - type: "null"
          title: Reviewed By
        reviewed_at:
          anyOf:
            - type: string
            - type: "null"
          title: Reviewed At
        review_notes:
          anyOf:
            - type: string
            - type: "null"
          title: Review Notes
        created_at:
          anyOf:
            - type: string
            - type: "null"
          title: Created At
        updated_at:
          anyOf:
            - type: string
            - type: "null"
          title: Updated At
      type: object
      required:
        - social_main_id
        - status
        - expired_checkouts_24h
        - expired_checkouts_7d
        - inventory_reservation_minutes_24h
        - cancelled_orders_7d
        - cancelled_orders_30d
      title: AbuseReportSchema
      description: Customer abuse status record for staff.
    AddressSummarySchema:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        city_name:
          type: string
          title: City Name
        province:
          type: string
          title: Province
        full_address:
          type: string
          title: Full Address
      type: object
      required:
        - id
        - name
        - city_name
        - province
        - full_address
      title: AddressSummarySchema
      description: Summary of selected address.
    BnplCalculateResponse:
      properties:
        checkout_id:
          type: string
          title: Checkout Id
        shop_id:
          type: string
          title: Shop Id
        eligible:
          type: boolean
          title: Eligible
        purchase_amount_minor:
          type: integer
          title: Purchase Amount Minor
        installment_count:
          anyOf:
            - type: integer
            - type: "null"
          title: Installment Count
        installments:
          items:
            $ref: "#/components/schemas/BnplInstallmentSchema"
          type: array
          title: Installments
          default: []
        cash_payment_required_minor:
          anyOf:
            - type: integer
            - type: "null"
          title: Cash Payment Required Minor
        shortage_amount_minor:
          anyOf:
            - type: integer
            - type: "null"
          title: Shortage Amount Minor
      type: object
      required:
        - checkout_id
        - shop_id
        - eligible
        - purchase_amount_minor
      title: BnplCalculateResponse
      description: Response for BNPL installment calculation.
    BnplInstallmentSchema:
      properties:
        installment_number:
          type: integer
          title: Installment Number
        amount_minor:
          anyOf:
            - type: integer
            - type: "null"
          title: Amount Minor
        due_date:
          anyOf:
            - type: string
            - type: "null"
          title: Due Date
      type: object
      required:
        - installment_number
      title: BnplInstallmentSchema
      description: Single installment in a BNPL plan.
    BnplPlanSchema:
      properties:
        plan_id:
          type: string
          title: Plan Id
        plan_name:
          anyOf:
            - type: string
            - type: "null"
          title: Plan Name
        plan_name_fa:
          anyOf:
            - type: string
            - type: "null"
          title: Plan Name Fa
        installment_count:
          anyOf:
            - type: integer
            - type: "null"
          title: Installment Count
        min_purchase_amount:
          anyOf:
            - type: string
            - type: "null"
          title: Min Purchase Amount
        max_purchase_amount:
          anyOf:
            - type: string
            - type: "null"
          title: Max Purchase Amount
      type: object
      required:
        - plan_id
