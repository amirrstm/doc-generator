        - discount_minor
        - line_total_minor
      title: ItemTotalSchema
      description: Totals for an item.
    MetadataSchema:
      properties:
        request_id:
          type: string
          title: Request Id
        timestamp:
          type: string
          title: Timestamp
        processing_time_ms:
          anyOf:
            - type: integer
            - type: "null"
          title: Processing Time Ms
      type: object
      required:
        - request_id
        - timestamp
      title: MetadataSchema
      description: |-
        Response metadata per API Design Standard.

        Fields: request_id, timestamp, processing_time_ms (optional)
    PaginationSchema:
      properties:
        page:
          type: integer
          title: Page
        page_size:
          type: integer
          title: Page Size
        total_items:
          type: integer
          title: Total Items
        total_pages:
          type: integer
          title: Total Pages
      type: object
      required:
        - page
        - page_size
        - total_items
        - total_pages
      title: PaginationSchema
      description: |-
        Pagination metadata per API Design Standard.

        Fields: page, page_size, total_items, total_pages
        (No has_next/has_previous - can be calculated client-side)
    PayBnplShopRequest:
      properties:
        bnpl_plan_id:
          type: string
          title: Bnpl Plan Id
          description: ID of the BNPL plan to use for payment
      type: object
      required:
        - bnpl_plan_id
      title: PayBnplShopRequest
      description: Request to pay a single shop via BNPL.
    PayBnplShopResponse:
      properties:
        checkout_id:
          type: string
          title: Checkout Id
        bnpl_checkout_id:
          type: string
          title: Bnpl Checkout Id
        shop_id:
          type: string
          title: Shop Id
        order_id:
          anyOf:
            - type: string
            - type: "null"
          title: Order Id
        order_number:
          anyOf:
            - type: string
            - type: "null"
          title: Order Number
        status:
          type: string
          title: Status
        remaining_shops:
          items:
            $ref: "#/components/schemas/RemainingShopSchema"
          type: array
          title: Remaining Shops
        checkout_completed:
          type: boolean
          title: Checkout Completed
      type: object
      required:
        - checkout_id
        - bnpl_checkout_id
        - shop_id
        - status
        - remaining_shops
        - checkout_completed
      title: PayBnplShopResponse
      description: Response for BNPL shop payment.
    PayRequest:
      properties:
        payment_callback_url:
          type: string
          title: Payment Callback Url
          description: URL where payment gateway will redirect after payment
        payment_method:
          $ref: "#/components/schemas/PaymentMethod"
          description: "Payment method: GREEN_WALLET, GREEN_IPG, or GREEN_BNPL"
          default: GREEN_WALLET
      type: object
      required:
        - payment_callback_url
      title: PayRequest
      description: Request to initiate payment for checkout.
    PayResponse:
      properties:
        checkout_id:
          type: string
          title: Checkout Id
        workflow_id:
          type: string
          title: Workflow Id
        status:
          type: string
          title: Status
        message:
          type: string
          title: Message
        idempotent:
          type: boolean
          title: Idempotent
          default: false
      type: object
      required:
        - checkout_id
        - workflow_id
        - status
        - message
      title: PayResponse
      description: Response for payment initiation.
    PaymentFailedRequest:
      properties:
        failure_reason:
          type: string
          title: Failure Reason
          description: Reason for payment failure
        payment_transaction_id:
          anyOf:
            - type: string
            - type: "null"
          title: Payment Transaction Id
          description: Transaction ID if available
      type: object
      required:
        - failure_reason
      title: PaymentFailedRequest
      description: Request to handle payment failure.
    PaymentFailedResponse:
      properties:
        checkout_id:
          type: string
          title: Checkout Id
        status:
          type: string
          title: Status
        workflow_id:
          anyOf:
            - type: string
            - type: "null"
          title: Workflow Id
        signal_sent:
          type: boolean
          title: Signal Sent
          default: false
        compensation_triggered:
          type: boolean
          title: Compensation Triggered
          default: false
      type: object
      required:
        - checkout_id
        - status
      title: PaymentFailedResponse
      description: Response for payment failed request.
    PaymentMethod:
      type: string
      enum:
        - GREEN_WALLET
        - GREEN_IPG
        - GREEN_BNPL
      title: PaymentMethod
      description: |-
        Payment method for transaction processing.

        All payment pipes go through GreenBank infrastructure.
        This enum is the cross-service source of truth.
    RemainingShopSchema:
      properties:
