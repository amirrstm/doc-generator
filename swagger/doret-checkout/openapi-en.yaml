        - currency_code
      title: ShippingOptionsResponse
      description: Response for shipping options query.
    ShopBnplPlansSchema:
      properties:
        shop_id:
          type: string
          title: Shop Id
        shop_name:
          type: string
          title: Shop Name
        bnpl_plans:
          items:
            $ref: "#/components/schemas/BnplPlanSchema"
          type: array
          title: Bnpl Plans
          default: []
      type: object
      required:
        - shop_id
        - shop_name
      title: ShopBnplPlansSchema
      description: BNPL plans for a single shop.
    ShopShippingConfirmationSchema:
      properties:
        shop_id:
          type: string
          title: Shop Id
        shop_name:
          type: string
          title: Shop Name
        method_name:
          type: string
          title: Method Name
        fee_minor:
          type: integer
          title: Fee Minor
        estimated_days:
          type: integer
          title: Estimated Days
      type: object
      required:
        - shop_id
        - shop_name
        - method_name
        - fee_minor
        - estimated_days
      title: ShopShippingConfirmationSchema
      description: Confirmation of shipping selection for a shop.
    ShopShippingOptionsSchema:
      properties:
        shop_id:
          type: string
          title: Shop Id
