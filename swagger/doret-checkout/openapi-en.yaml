          type: integer
          title: Total Weight Grams
        shipping_available:
          type: boolean
          title: Shipping Available
        options:
          items:
            $ref: "#/components/schemas/ShippingOptionSchema"
          type: array
          title: Options
      type: object
      required:
        - shop_id
        - shop_name
        - total_weight_grams
        - shipping_available
