          title: Total Minor
        items_count:
          type: integer
          title: Items Count
      type: object
      required:
        - shop_id
        - shop_name
        - total_minor
        - items_count
      title: RemainingShopSchema
      description: Summary of a shop still remaining in the parent checkout.
    SelectAddressRequest:
      properties:
        address_id:
          type: string
          title: Address Id
