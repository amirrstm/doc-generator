      summary: Get any interaction (staff)
      description: Retrieve any interaction across all realms. Staff-only endpoint.
      operationId: get_any_interaction_api_v1_staff_interactions__interaction_id__get
      parameters:
        - name: interaction_id
          in: path
          required: true
          schema:
            type: string
            title: Interaction Id
        - name: realm
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: Realm ID of the interaction
            title: Realm
          description: Realm ID of the interaction
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    patch:
