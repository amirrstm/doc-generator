            and agent. Example: searching 'setup' will find 'account setup',
            'Setup wizard', etc."
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            description: Sort field(s)
            default: created_at
            title: Sort By
          description: Sort field(s)
        - name: sort_order
          in: query
          required: false
          schema:
            type: string
            description: "Sort order(s): asc or desc"
            default: desc
            title: Sort Order
          description: "Sort order(s): asc or desc"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListInteractionsResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
