    delete:
      tags:
        - Organization - Interactions
      summary: Delete organization interaction
      description: Permanently delete any interaction within the organization realm.
      operationId: delete_org_interaction_api_v1_org_interactions__interaction_id__delete
      parameters:
        - name: interaction_id
          in: path
          required: true
