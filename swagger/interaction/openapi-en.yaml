                $ref: "#/components/schemas/InteractionUpdatedResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/staff/interactions/:
    get:
      tags:
        - Staff - Interactions
      summary: List all interactions (staff)
      description: Retrieve interactions across all realms with secure filtering.
        Staff-only endpoint with full access.
      operationId: list_all_interactions_api_v1_staff_interactions__get
      parameters:
        - name: realm
          in: query
          required: true
          schema:
            type: string
            description: Filter by realm (required)
            title: Realm
          description: Filter by realm (required)
        - name: user_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: Filter by user (optional)
            title: User Id
          description: Filter by user (optional)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            description: Page number (1-indexed)
            default: 1
            title: Page
          description: Page number (1-indexed)
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            description: Items per page
