    MessageSerializer:
      properties:
        message_id:
          type: string
          title: Message Id
          description: Unique identifier for the message
        interaction_id:
          type: string
          title: Interaction Id
          description: Reference to parent interaction
        realm:
          type: string
          title: Realm
          description: Tenant/realm identifier
        role:
          $ref: "#/components/schemas/MessageRole"
          description: Message sender role
        text:
          anyOf:
            - type: string
            - type: "null"
          title: Text
          description: Text content of the message
        user:
          anyOf:
            - type: string
            - type: "null"
          title: User
          description: User ID associated with the message (owner)
        sender:
          anyOf:
            - type: string
            - type: "null"
          title: Sender
          description: Sender of the message (actual sender)
        correlation_id:
          anyOf:
            - type: string
            - type: "null"
          title: Correlation Id
          description: Correlation ID for distributed tracing
        request_id:
          anyOf:
            - type: string
            - type: "null"
          title: Request Id
          description: Unique identifier for the request
        finish_reason:
          anyOf:
            - type: string
            - type: "null"
          title: Finish Reason
          description: Reason for finishing the message generation
        parent_message_id:
          anyOf:
            - type: string
            - type: "null"
          title: Parent Message Id
          description: Unique identifier of the parent message
        metadata:
          items:
            type: string
          type: array
          title: Metadata
          description: Metadata tags
        user_metadata:
          additionalProperties: true
          type: object
          title: User Metadata
          description: User metadata
        message_metadata:
          $ref: "#/components/schemas/MessageMetadataSerializer"
          description: Message state and tracking metadata
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Creation timestamp
        updated_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Updated At
          description: Last update timestamp
        deleted_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Deleted At
          description: Soft delete timestamp
      type: object
      required:
        - message_id
        - interaction_id
        - realm
        - role
        - created_at
      title: MessageSerializer
      description: >-
        Base message serializer with all database model fields.


        This serves as the common base that all role-specific serializers
        inherit from.

        Contains all fields from the Message document model.


        Role-specific serializers can:

        - Inherit all fields as-is

        - Override field configurations (e.g., mark as Optional, exclude)

        - Add computed fields


        Attributes:
            message_id: Unique UUID v7 identifier (time-sortable)
            interaction_id: Reference to parent interaction
            realm: Tenant/realm identifier for multi-tenancy
            role: Message sender role (AI, USER, SYSTEM)
            text: Text content of the message
            user: User ID of the conversation owner
            sender: User ID of the actual message sender (for human-in-the-loop)
            correlation_id: Correlation ID for distributed tracing
            request_id: Request ID for request tracing
            finish_reason: Reason for AI message generation completion
            parent_message_id: Parent message ID for threading
            metadata: Additional metadata as key-value pairs
            user_metadata: User-specific metadata
            message_metadata: Message state and tracking metadata
            created_at: When the message was created
            updated_at: When the message was last updated
            deleted_at: When the message was soft-deleted
      example:
        correlation_id: req_abc123
        created_at: 2024-01-15T10:30:00Z
        interaction_id: 01HQBY9876543210ZYXWVUTSRQP
        message_id: 01HQBX1234567890ABCDEFGHIJK
        message_metadata:
          error: false
          is_edited: false
          is_viewed: true
          is_visible: true
          message_views: []
          need_human_responder: false
        metadata:
          - chat
          - support
        realm: realm_123
        request_id: req_xyz456
        role: user
        sender: user_789
        text: Hello, how can you help me?
        user: user_789
        user_metadata:
          priority: high
    PaginationMetadata:
      properties:
        page:
          type: integer
          minimum: 1
          title: Page
          description: Current page number (1-indexed)
        page_size:
          type: integer
          maximum: 100
          minimum: 1
          title: Page Size
          description: Items per page
        total_items:
          type: integer
          minimum: 0
          title: Total Items
          description: Total number of items
        total_pages:
          type: integer
          minimum: 0
          title: Total Pages
          description: Total number of pages
        has_next:
          type: boolean
          title: Has Next
          description: Whether there is a next page
        has_previous:
          type: boolean
          title: Has Previous
          description: Whether there is a previous page
      type: object
      required:
        - page
        - page_size
        - total_items
        - total_pages
        - has_next
        - has_previous
      title: PaginationMetadata
      description: |-
        Pagination metadata per API Design Standard.

        Used in query results to provide complete pagination information
        including current page, total counts, and navigation flags.

        Attributes:
            page: Current page number (1-indexed)
            page_size: Number of items per page
            total_items: Total count of items across all pages
            total_pages: Total number of pages
            has_next: Whether there is a next page available
            has_previous: Whether there is a previous page available

        Example:
            >>> pagination = PaginationInfo(
            ...     page=2,
            ...     page_size=20,
            ...     total_items=247,
            ...     total_pages=13,
            ...     has_next=True,
            ...     has_previous=True
            ... )
      example:
        has_next: true
        has_previous: true
        page: 2
        page_size: 20
        total_items: 247
        total_pages: 13
