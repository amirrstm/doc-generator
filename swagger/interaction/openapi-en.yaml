openapi: 3.1.0
info:
  title: Interaction History Service
  version: 0.1.0
servers:
  - url: https://stage.server.url
    description: Stage Server
  - url: https://api.server.url
    description: Production Server
paths:
  /api/v1/enduser/interactions/:
    post:
      tags:
        - Enduser - Interactions
      summary: Create my interaction
      description: Create a new interaction. The user_id in request body must match
        the authenticated user.
      operationId: create_my_interaction_api_v1_enduser_interactions__post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInteractionRequestSchema"
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionCreatedResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    get:
      tags:
        - Enduser - Interactions
      summary: List my interactions
      description: Retrieve a paginated list of your own interactions with secure filtering.
      operationId: list_my_interactions_api_v1_enduser_interactions__get
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            description: Page number (1-indexed)
            default: 1
            title: Page
          description: Page number (1-indexed)
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            description: Items per page
            default: 20
            title: Page Size
          description: Items per page
        - name: search_term
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: "Search term for full-text 'contains' search (case-insensitive)
              across title, description, tags, status, state, interaction_type,
              and agent. Example: searching 'setup' will find 'account setup',
              'Setup wizard', etc."
            title: Search Term
          description: "Search term for full-text 'contains' search (case-insensitive)
            across title, description, tags, status, state, interaction_type,
            and agent. Example: searching 'setup' will find 'account setup',
            'Setup wizard', etc."
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            description: Sort field(s)
            default: created_at
            title: Sort By
          description: Sort field(s)
        - name: sort_order
          in: query
          required: false
          schema:
            type: string
            description: "Sort order(s): asc or desc"
            default: desc
            title: Sort Order
          description: "Sort order(s): asc or desc"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListInteractionsResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/enduser/interactions/{interaction_id}:
    get:
      tags:
        - Enduser - Interactions
      summary: Get my interaction by ID
      description: Retrieve a single interaction. You can only access your own interactions.
      operationId: get_my_interaction_api_v1_enduser_interactions__interaction_id__get
      parameters:
        - name: interaction_id
          in: path
          required: true
          schema:
            type: string
            title: Interaction Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    patch:
      tags:
        - Enduser - Interactions
      summary: Update my interaction
      description: Update your own interaction with partial data.
      operationId: update_my_interaction_api_v1_enduser_interactions__interaction_id__patch
      parameters:
        - name: interaction_id
          in: path
          required: true
          schema:
            type: string
            title: Interaction Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInteractionRequestSchema"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionUpdatedResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    delete:
      tags:
        - Enduser - Interactions
      summary: Delete my interaction
      description: Permanently delete your own interaction.
      operationId: delete_my_interaction_api_v1_enduser_interactions__interaction_id__delete
      parameters:
        - name: interaction_id
          in: path
          required: true
          schema:
            type: string
            title: Interaction Id
        - name: reason
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: Reason for deletion
            title: Reason
          description: Reason for deletion
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionDeletedResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/enduser/interactions/{interaction_id}/archive:
    post:
      tags:
        - Enduser - Interactions
      summary: Archive my interaction
      description: Archive your own interaction (soft delete).
      operationId: archive_my_interaction_api_v1_enduser_interactions__interaction_id__archive_post
      parameters:
        - name: interaction_id
          in: path
          required: true
          schema:
            type: string
            title: Interaction Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveInteractionRequestSchema"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionUpdatedResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/enduser/interactions/{interaction_id}/messages:
    post:
      tags:
        - Enduser - Messages
      summary: Create message in interaction
      description: Create a new message within a specific interaction. User field is
        automatically set to authenticated user.
      operationId: create_message_in_interaction_api_v1_enduser_interactions__interaction_id__messages_post
      parameters:
        - name: interaction_id
          in: path
          required: true
          schema:
            type: string
            title: Interaction Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequestSchema"
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageSerializer"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    get:
      tags:
        - Enduser - Messages
      summary: List messages in interaction
      description: Retrieve all messages for a specific interaction (only if user owns
        the interaction).
      operationId: list_messages_in_interaction_api_v1_enduser_interactions__interaction_id__messages_get
      parameters:
        - name: interaction_id
          in: path
          required: true
          schema:
            type: string
            title: Interaction Id
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            description: Page number
            default: 1
            title: Page
          description: Page number
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            description: Items per page
            default: 50
            title: Page Size
          description: Items per page
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMessagesResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/enduser/{message_id}:
    get:
      tags:
        - Enduser - Messages
      summary: Get message by ID
      description: Retrieve a specific message by its ID (only if user owns it).
      operationId: get_message_api_v1_enduser__message_id__get
      parameters:
        - name: message_id
          in: path
          required: true
          schema:
            type: string
            title: Message Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageSerializer"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    put:
      tags:
        - Enduser - Messages
      summary: Update message
      description: Update an existing message's content or metadata (only if user owns it).
      operationId: update_message_api_v1_enduser__message_id__put
      parameters:
        - name: message_id
          in: path
          required: true
          schema:
            type: string
            title: Message Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMessageRequestSchema"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageSerializer"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    delete:
      tags:
        - Enduser - Messages
      summary: Delete message
      description: Soft delete a message (only if user owns it).
      operationId: delete_message_api_v1_enduser__message_id__delete
      parameters:
        - name: message_id
          in: path
          required: true
          schema:
            type: string
            title: Message Id
      responses:
        "204":
          description: Successful Response
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/org/interactions/:
    post:
      tags:
