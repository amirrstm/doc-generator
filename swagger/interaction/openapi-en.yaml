      summary: Update any interaction (staff)
      description: Update any interaction across all realms. Staff-only endpoint.
      operationId: update_any_interaction_api_v1_staff_interactions__interaction_id__patch
      parameters:
        - name: interaction_id
          in: path
          required: true
          schema:
            type: string
            title: Interaction Id
        - name: realm
          in: query
          required: false
          schema:
