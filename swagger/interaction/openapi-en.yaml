                $ref: "#/components/schemas/InteractionUpdatedResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    delete:
      tags:
        - Staff - Interactions
      summary: Delete any interaction (staff)
      description: Permanently delete any interaction across all realms. Staff-only
        endpoint.
      operationId: delete_any_interaction_api_v1_staff_interactions__interaction_id__delete
      parameters:
        - name: interaction_id
          in: path
          required: true
          schema:
            type: string
            title: Interaction Id
        - name: realm
          in: query
          required: false
          schema:
            anyOf:
