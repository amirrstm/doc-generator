            type: string
            title: Interaction Id
        - name: reason
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: Reason for deletion
            title: Reason
          description: Reason for deletion
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionDeletedResponseSchema"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
