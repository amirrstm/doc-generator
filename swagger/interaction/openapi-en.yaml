                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/generic/health:
    get:
      tags:
        - Generic - Public
      summary: Health check
      description: Public health check endpoint to verify service availability.
      operationId: health_check_api_v1_generic_health_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/generic/info:
    get:
      tags:
        - Generic - Public
      summary: Service information
      description: Public endpoint for service metadata.
      operationId: service_info_api_v1_generic_info_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
  /:
    get:
      summary: Root
      description: Root endpoint
      operationId: root__get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health:
    get:
      summary: Health Check
      description: Health check endpoint
      operationId: health_check_health_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    ArchiveInteractionRequestSchema:
      properties:
        reason:
          anyOf:
            - type: string
            - type: "null"
          title: Reason
          description: Reason for archiving
      type: object
      title: ArchiveInteractionRequestSchema
      description: |-
        Schema for archiving an interaction.

        Attributes:
            reason: Optional reason for archiving
      example:
        reason: User requested archive
    CreateInteractionRequestSchema:
      properties:
        user_id:
          type: string
          title: User Id
          description: ID of the user
        interaction_type:
          type: string
          title: Interaction Type
          description: Type of interaction
        agent:
          type: string
          title: Agent
          description: Agent title or slug
          default: system
        title:
          anyOf:
            - type: string
            - type: "null"
          title: Title
          description: Title of the interaction
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
          description: Description of the interaction
        payload:
          additionalProperties: true
          type: object
          title: Payload
          description: Agent-specific data
        tags:
          items:
            type: string
          type: array
          title: Tags
          description: Searchable tags
        parent_interaction_id:
          anyOf:
            - type: string
            - type: "null"
          title: Parent Interaction Id
          description: Parent interaction ID
        state:
          anyOf:
            - type: string
            - type: "null"
          title: State
          description: Initial workflow state
        source:
          anyOf:
            - $ref: "#/components/schemas/Source"
            - type: "null"
          description: Source of interaction
      type: object
      required:
        - user_id
        - interaction_type
      title: CreateInteractionRequestSchema
      description: |-
        Schema for creating a new interaction.

