      operationId: list_org_interactions_api_v1_org_interactions__get
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: Filter by specific user (optional)
            title: User Id
          description: Filter by specific user (optional)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            description: Page number (1-indexed)
            default: 1
            title: Page
          description: Page number (1-indexed)
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            description: Items per page
            default: 20
            title: Page Size
          description: Items per page
        - name: search_term
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: "Search term for full-text 'contains' search (case-insensitive)
              across title, description, tags, status, state, interaction_type,
              and agent. Example: searching 'setup' will find 'account setup',
